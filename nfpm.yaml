name: "updates-exporter"
arch: "amd64"
platform: "linux"
version: "${VERSION}" # Can be passed dynamically from GitHub Actions
release: 1
section: "default"
priority: "optional"
maintainer: "DevOps"
description: "Exports misc info about updates for Prometheus."
vendor: "Puppeteers"
license: "MIT"

# Define the files to include in the RPM
contents:
  - src: "./updates-exporter"
    dst: "/usr/local/bin/updates-exporter"
    file_info:
      mode: 0755

  - src: "./packaging/updates-exporter.service"
    dst: "/usr/lib/systemd/system/updates-exporter.service"
    file_info:
      mode: 0644

# Tell systemd to reload and enable the service on install/uninstall
scripts:
  postinstall: ./packaging/postinstall.sh
  preremove: ./packaging/preremove.sh
